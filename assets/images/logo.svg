<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="200" height="60" fill="none"/>
  <!-- Modern Building Icon -->
  <g filter="url(#shadow)">
    <path d="M20 45 L20 20 L30 15 L30 45 Z" fill="url(#logoGradient)"/>
    <path d="M32 45 L32 18 L42 12 L42 45 Z" fill="url(#logoGradient)" opacity="0.9"/>
    <path d="M44 45 L44 16 L54 10 L54 45 Z" fill="url(#logoGradient)" opacity="0.8"/>
    <path d="M56 45 L56 14 L66 8 L66 45 Z" fill="url(#logoGradient)" opacity="0.7"/>
    <rect x="20" y="45" width="46" height="3" fill="url(#logoGradient)" rx="1"/>
  </g>
  <!-- Text -->
  <text x="75" y="38" font-family="Tajawal, sans-serif" font-size="28" font-weight="800" fill="#1f2937" letter-spacing="1">Luxoria</text>
</svg>
